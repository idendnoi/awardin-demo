<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AwardIn – 수상 이력 인증·아카이빙 플랫폼 데모">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>AwardIn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;800&family=Song+Myung&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Single light theme by request (always white). Brand: key blues #89C0FF / #C9DEFC on white, dark-gray type, AwardIn A-mark. Layout: a working web app, not a brochure. Login → issuer console (sidebar shell, page-per-route) / student app (top tabs) / public verify site. Quiet white canvas, near-black type, one violet accent. */
:root{
  --bg:#FFFFFF; --bg-soft:#F7FAFF; --surface:#FFFFFF; --sunken:#F1F5FB;
  --line:#E4EAF3; --line-strong:#CDD7E4;
  --ink:#2E3036; --ink-2:#46484E; --muted:#7D828B; --faint:#A7ADB7;
  --key:#89C0FF; --key-2:#C9DEFC;
  --brand:#2470DE; --brand-ink:#1A5BBF; --brand-soft:#EEF5FF; --brand-line:#C9DEFC;
  --btn:#2470DE; --btn-ink:#FFFFFF;
  --ok:#0B8A47; --ok-soft:#E6F6EC; --bad:#D93838; --bad-soft:#FDECEC; --warn:#A8620A; --warn-soft:#FDF2E2;
  --beam-a:#C9DEFC; --beam-b:#A9D0FF; --beam-c:#F5F9FF;
  --shadow:0 1px 2px rgba(15,22,36,.04),0 8px 24px rgba(15,22,36,.07);
  --f-display:"Manrope","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.025em}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:0;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:2px;width:0;background:var(--brand);z-index:120;opacity:0;transition:width .35s ease,opacity .2s}
#progress.run{opacity:1;width:72%}
#progress.done{opacity:0;width:100%}
.enter{animation:enter .22s ease both}
@keyframes enter{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}#progress{transition:none}}
.skel{border-radius:10px;background:linear-gradient(90deg,var(--sunken) 25%,var(--line) 50%,var(--sunken) 75%);background-size:200% 100%;animation:sk 1.1s infinite linear}
@keyframes sk{to{background-position:-200% 0}}

.btn{appearance:none;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn-dark{background:var(--btn);color:var(--btn-ink)} .btn-dark:hover{opacity:.88}
.btn-light{background:var(--surface);color:var(--ink);border-color:var(--line-strong)} .btn-light:hover{background:var(--sunken)}
.btn-brand{background:var(--brand);color:#fff} .btn-brand:hover{opacity:.9}
.btn-ghost{background:transparent;color:var(--ink-2)} .btn-ghost:hover{background:var(--sunken)}
.btn-danger{background:var(--surface);color:var(--bad);border-color:var(--line-strong)} .btn-danger:hover{background:var(--bad-soft)}
.btn-danger-solid{background:var(--bad);color:#fff}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:7px}
.btn-lg{height:48px;padding:0 22px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600;cursor:pointer}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;justify-self:start}
.back:hover{color:var(--ink)}

.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,.textarea,.select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;min-width:0}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.textarea{min-height:190px;resize:vertical;line-height:1.6}
.help{font-size:12.5px;color:var(--muted)}
.switch{position:relative;width:40px;height:24px;border-radius:999px;background:var(--line-strong);border:0;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:var(--sunken);color:var(--muted)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.brand{background:var(--brand-soft);color:var(--brand-ink)} .pill.plain::before{display:none}

.logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.03em;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
.logo-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(165deg,var(--key) 0%,#A9CFFF 55%,var(--key-2) 100%);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 2px 6px rgba(70,130,220,.25)}
.logo b{color:inherit}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card-pad{padding:24px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--bg-soft)}
tbody tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--bg-soft)}
tr.pv-row{cursor:pointer} tr.pv-row.sel td{background:var(--brand-soft)} tr.pv-row.sel td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.pv-cap{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--muted)} .pv-cap b{color:var(--ink);font-size:14px}
.pv-nav{display:flex;gap:4px} .pv-nav button{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--ink-2);font:inherit} .pv-nav button:disabled{opacity:.35;cursor:default}
td.diff{color:var(--bad);font-weight:700}
td .cell-input{width:100%;min-width:90px;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;font:inherit;color:inherit}
td .cell-input:hover{border-color:var(--line)} td .cell-input:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);font-size:14.5px}
.kv dt,.kv dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted)} .kv dd{font-weight:600;min-width:0;overflow-wrap:anywhere}
.kv dt:last-of-type,.kv dd:last-of-type{border-bottom:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:1fr}}
.cert-img{width:100%;display:block;border-radius:6px;box-shadow:0 0 0 1px var(--line),0 14px 34px -14px rgba(20,20,40,.28);background:#FBF9F4;aspect-ratio:848/1200;max-width:460px;margin-inline:auto}
.empty{padding:44px 20px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty b{color:var(--ink)}
.verdict{border-radius:16px;padding:22px 24px;display:flex;gap:16px;align-items:flex-start}
.verdict .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.verdict h2{font-size:20px;font-weight:700;line-height:1.4}
.verdict p{margin-top:4px;color:var(--ink-2);font-size:14.5px}
.verdict.ok{background:var(--ok-soft)} .verdict.ok .ic{background:var(--ok);color:#fff} .verdict.ok h2{color:var(--ok)}
.verdict.bad{background:var(--bad-soft)} .verdict.bad .ic{background:var(--bad);color:#fff} .verdict.bad h2{color:var(--bad)}
.verdict.none{background:var(--sunken)} .verdict.none .ic{background:var(--muted);color:#fff}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;font-size:13.5px;background:var(--sunken);color:var(--ink-2)}
.banner.brand{background:var(--brand-soft);color:var(--brand-ink)} .banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.bad{background:var(--bad-soft);color:var(--bad)}
.dropzone{border:1.5px dashed var(--line-strong);border-radius:16px;padding:36px 24px;display:grid;gap:14px;justify-items:center;text-align:center;background:var(--bg-soft);transition:border-color .15s,background .15s}
.dropzone.over{border-color:var(--brand);background:var(--brand-soft)}
.dropzone .ic{width:48px;height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.preview-img{max-height:320px;max-width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--brand);animation:spin .8s linear infinite;flex:none}
.spinner.lg{width:40px;height:40px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.working{min-height:52vh;display:grid;place-items:center;text-align:center}
.working>div{display:grid;gap:14px;justify-items:center}
.working h2{font-size:21px}
.working p{color:var(--ink-2)}
.bar{width:280px;max-width:100%;height:6px;border-radius:999px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .25s}
.wmbox{display:grid;gap:12px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface)}
.wmbox .hd{display:flex;gap:12px;align-items:center;justify-content:space-between}
.wmbox .hd b{display:flex;align-items:center;gap:8px;font-size:14.5px}
.wmbox .hd b i{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.wm-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);justify-content:center}
.wm-legend span{display:inline-flex;align-items:center;gap:6px} .wm-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.cert-img.wm-on{background:#0B1424}
.share{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;background:var(--bg-soft);min-width:0}
.share span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.resume{font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap;background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:14px;line-height:1.7;user-select:all;overflow-wrap:anywhere}
.feed{display:grid}
.feed>div{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.feed>div:last-child{border-bottom:0}
.feed .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.feed .t{font-size:14px;font-weight:600}
.feed .m{font-size:12.5px;color:var(--muted)}
.new-flash{animation:flash 2.4s ease;border-radius:10px}
@keyframes flash{0%,40%{background:var(--brand-soft)}100%{background:transparent}}
.stepper{display:flex;gap:8px;flex-wrap:wrap}
.stepper div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);padding:7px 13px 7px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.stepper i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);font-size:12px}
.stepper .on{color:var(--ink);border-color:var(--ink)} .stepper .on i{background:var(--btn);color:var(--btn-ink)}
.stepper .done i{background:var(--ok);color:#fff}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.form-grid{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;background:var(--btn);color:var(--btn-ink);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.demo-ribbon{font-size:12.5px;color:var(--muted);text-align:center;padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));background:var(--bg-soft);border-bottom:1px solid var(--line)}
.demo-ribbon b{color:var(--ink-2)}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:70;max-height:70vh;overflow-y:auto}
.pop .hd{padding:10px 12px 8px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line);margin-bottom:4px}
.pop button.item{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;align-items:flex-start}
.pop button.item:hover{background:var(--sunken)}
.pop button.item small{display:block;color:var(--muted);font-size:12px}
.anchor{position:relative}
.icon-btn{appearance:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink-2);position:relative}
.icon-btn:hover{background:var(--sunken)}
.icon-btn .dotn{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;background:var(--brand-soft);color:var(--brand-ink);flex:none}

.auth{position:relative;overflow:hidden;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:linear-gradient(90deg,#F2F7FF 0%,#F6FAFF 38%,#FBFDFF 62%,#FFFFFF 85%)}
.auth::before{content:"";position:absolute;inset:-10%;pointer-events:none;background:radial-gradient(38% 50% at 36% 40%,rgba(169,208,255,.55),transparent 70%),radial-gradient(32% 42% at 20% 84%,rgba(201,222,252,.75),transparent 72%),radial-gradient(48% 62% at 66% 52%,rgba(201,222,252,.32),transparent 78%)}
.auth>*{position:relative}
.auth-art{position:relative;padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.auth-art>*{position:relative}
.auth-art h2{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.3}
.auth-art p{color:var(--ink-2);margin-top:10px}
.auth-hero{display:grid;gap:28px;justify-items:start;align-self:center;width:min(440px,100%);margin-left:clamp(0px,calc((100% - 440px) * .62),220px)}.auth-icon{width:min(280px,64%);height:auto;filter:drop-shadow(0 18px 36px rgba(70,130,220,.18))}.brand-word{font-family:var(--f-display);font-weight:800;font-size:64px!important;letter-spacing:-.045em;line-height:1;color:var(--ink-2)}.tagline{font-size:20px;font-weight:600;color:var(--ink-2)!important;margin-top:12px!important}
.auth-form{display:grid;place-items:center;padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.auth-box{width:min(420px,100%);display:grid;gap:18px}
.auth-box h1{font-family:var(--f-display);font-weight:700;font-size:28px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunken);border-radius:10px;padding:4px}
.seg button{border:0;background:none;padding:9px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12.5px}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}
.m-logo{display:none}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-art{display:none}.m-logo{display:inline-flex}}

.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--bg-soft);padding:18px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.side .logo{padding:4px 8px 14px}
.org{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
.org .mark{width:34px;height:34px;border-radius:9px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.org b{display:block;font-size:13.5px;line-height:1.3}
.org small{color:var(--muted);font-size:12px}
.side-label{font-size:11.5px;font-weight:700;color:var(--faint);padding:14px 10px 6px;letter-spacing:.04em}
.side-nav{display:grid;gap:2px}
.side-nav button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink-2);text-align:left}
.side-nav button svg{flex:none;color:var(--muted)}
.side-nav button:hover{background:var(--sunken)}
.side-nav button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.side-nav button[aria-current="page"] svg{color:var(--brand)}
.side-nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.side-foot{margin-top:auto;display:grid;gap:6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);z-index:40}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-right:auto;min-width:0;overflow:hidden;white-space:nowrap}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:14px}
.crumbs button:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;width:min(300px,34vw)}
.search .input{padding-left:34px;height:38px}
.search>span{position:absolute;left:11px;top:10px;color:var(--muted)}
.content{padding:28px 28px 72px;padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:24px;max-width:1200px;width:100%}
.page-title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-title h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.3}
.page-title p{color:var(--ink-2);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:700px){.kpis{grid-template-columns:1fr}}
.kpi{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--surface);display:grid;gap:2px;text-align:left}
button.kpi{cursor:pointer;font:inherit;color:inherit} button.kpi:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi small{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:20px 22px;min-width:0}
.panel-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.panel-hd h2{font-size:16px;font-weight:700}
.contests{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.contest{appearance:none;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:20px;cursor:pointer;display:grid;gap:12px;transition:border-color .15s,box-shadow .15s;font:inherit;color:inherit}
.contest:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.contest h3{font-size:16.5px;font-weight:700;line-height:1.4}
.contest .m{font-size:13px;color:var(--muted)}
.contest .nums{display:flex;gap:18px;font-size:13px;color:var(--ink-2)}
.contest .nums b{font-family:var(--f-display);font-size:18px;display:block;color:var(--ink)}
.req{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.req:hover{background:var(--bg-soft)}
.req:last-child{border-bottom:0}
.req img{width:100px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunken)}
.req .t{font-weight:700} .req .m{font-size:13px;color:var(--muted)}
.mobile-tabs{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobile-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg-soft)}
  .mobile-tabs button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .mobile-tabs button[aria-current="page"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search{display:none}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .req{grid-template-columns:1fr}
}

.s-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.s-head .wrap{height:64px;display:flex;align-items:center;gap:20px}
.s-tabs{display:flex;gap:2px;margin-right:auto}
.s-tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer}
.s-tabs button:hover{color:var(--ink)}
.s-tabs button[aria-current="page"]{color:var(--ink);background:var(--sunken)}
.s-tabs .n{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:4px;padding:0 5px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px}
.s-body{padding-block:32px 72px;display:grid;gap:24px}
.profile{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile .avatar{width:56px;height:56px;font-size:19px}
.profile h1{font-family:var(--f-display);font-weight:700;font-size:26px}
.profile p{color:var(--ink-2)}
.profile .nums{display:flex;gap:26px;margin-left:auto}
.profile .nums div{display:grid}
.profile .nums b{font-family:var(--f-display);font-size:22px;font-weight:700}
.profile .nums span{font-size:12.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.acard{appearance:none;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:0;cursor:pointer;overflow:hidden;display:grid;transition:border-color .15s,box-shadow .15s;font:inherit;color:inherit}
.acard:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.acard img{aspect-ratio:848/1200;width:100%;display:block;background:var(--sunken);border-bottom:1px solid var(--line)}
.acard .body{padding:14px 16px;display:grid;gap:5px}
.acard .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acard .t b{font-size:16.5px}
.acard .m{font-size:13px;color:var(--muted);line-height:1.5}
@media (max-width:700px){.s-tabs button{padding:8px 7px;font-size:13.5px}.s-head .wrap{gap:8px}.s-head .logo span:last-child{display:none}.profile .nums{margin-left:0}}

.v-hero{position:relative;overflow:hidden}
.v-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(50% 70% at 80% 10%,var(--beam-b),transparent 70%),radial-gradient(40% 60% at 15% 90%,var(--beam-a),transparent 72%),linear-gradient(180deg,var(--beam-c),var(--bg));pointer-events:none}
.v-hero .wrap{position:relative;padding-block:52px 36px;display:grid;gap:16px;justify-items:center;text-align:center}
.v-hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px)}
.v-hero p{color:var(--ink-2);max-width:34em}
.vsearch{display:flex;gap:8px;width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.vsearch .input{border:0;box-shadow:none;font-family:var(--f-mono);font-size:15px}
.vsearch .input:focus{box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:13px;color:var(--muted)}
.code-chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-family:var(--f-mono);font-size:12px;cursor:pointer;color:var(--ink-2)}
.code-chip:hover{border-color:var(--brand-line);color:var(--brand-ink)}
.v-body{max-width:900px;margin:0 auto;padding-block:8px 72px;display:grid;gap:20px}
.v-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.v-tabs button{background:none;border:0;padding:12px 14px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.v-tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
</style>

    try { const r = await S.sample.json(EXTRACT, {images:[blob]}); return {ai:true, data:{award:String(r.award||'').replace(/\s/g,''), contest:String(r.contest||''), name:String(r.name||'').replace(/\s/g,''), team:String(r.team||''), org:String(r.org||''), signer:String(r.signer||''), date:isoDate(r.date), code:String(r.code||'').trim().toUpperCase()}}; }
    catch(e) { return {ai:false, note:aiErr(e.code), data:fallback ? {...fallback} : null}; }
  }
  await sleep(1200);
  return {ai:false, note:'AI에 연결되지 않아 예시 판독 결과를 보여 드려요.', data:fallback ? {...fallback} : null};
}

/* router */
let navToken = 0;
async function nav(path, opts = {}){
  if (!opts.replace && S.path !== path) S.hist.push(S.path);
  S.path = path; S.pop = null; S.confirm = null;
  const tok = ++navToken, bar = $('#progress');
  bar.className = ''; void bar.offsetWidth; bar.className = 'run';
  if (!opts.instant) { render(true, true); await sleep(260); if (tok !== navToken) return; }
  bar.className = 'done';
  render(true); window.scrollTo({top:0});
}
function back(fallback){ const p = S.hist.pop(); nav(p || fallback, {replace:true}); }
function guard(){
  const p = S.path;
  if (p.startsWith('c/') && S.role !== 'issuer') { S.path = 'login'; S.loginTab = 'issuer'; }
  if (p.startsWith('s/') && S.role !== 'student') { S.path = 'login'; S.loginTab = 'student'; }

function render(enter = true, loading = false){

    const crumb = [['콘솔','c/home']];
    let inner = loading ? skeleton() : '';
    if (seg[1] === 'home') { crumb.push(['홈','c/home']); if (!loading) inner = cHome(); }
    else if (seg[1] === 'contests') { crumb.push(['대회·상장','c/contests']); if (!loading) inner = cContests(); }
    else if (seg[1] === 'contest') { const c = contests().find(x => x.key === seg[2]); crumb.push(['대회·상장','c/contests'], [c ? c.contest : '대회', p]); if (!loading) inner = cContest(seg[2]); }
    else if (seg[1] === 'award') { const a = byId(seg[2]); crumb.push(['대회·상장','c/contests'], [a ? `${a.name} · ${a.award}` : '상장', p]); if (!loading) inner = cAward(seg[2]); }
    else if (seg[1] === 'new') { crumb.push(['새 상장 발급', 'c/new/1']); if (!loading) inner = cNew(seg[2]); }
    else if (seg[1] === 'requests') { crumb.push(['확인 요청','c/requests']); if (!loading) inner = cRequests(); }
    else if (seg[1] === 'request') { const a = byId(seg[2]); crumb.push(['확인 요청','c/requests'], [a ? a.name : '요청', p]); if (!loading) inner = cRequest(seg[2]); }
    else if (seg[1] === 'activity') { crumb.push(['진위 조회 기록','c/activity']); if (!loading) inner = cActivity(); }
    html = cShell(crumb, inner);
  }
  else if (seg[0] === 's') {
    const inner = loading ? skeleton() : seg[1] === 'award' ? sAward(seg[2]) : seg[1] === 'upload' ? sUpload(seg[2]) : seg[1] === 'reprint' ? sReprint(seg[2]) : seg[1] === 'notifications' ? sNotifications() : sHome();
    html = sShell(inner);
  }
  else {
    if (seg[1] === 'copy') html = vShell(loading ? skeleton() : vCopy(), 'copy');
    else if (seg[1]) html = vShell(loading ? skeleton() : vResult(decodeURIComponent(seg[1])), 'code');

  bindDrop();
}

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.wiz) { S.wiz.info[el.dataset.wiz] = el.value; const sl = $('#w-sl'); if (sl) sl.textContent = signLine(S.wiz.info); }
  if (el.dataset.wizraw) S.wiz.raw = el.value;
  if (el.dataset.row !== undefined && el.dataset.key) { S.wiz.roster[+el.dataset.row][el.dataset.key] = el.value; if (+el.dataset.row === pvIdx()) { const cap = $('#pvCap'); if (cap) cap.innerHTML = pvCapHtml(); clearTimeout(pvTimer); pvTimer = setTimeout(drawPv, 250); } }
  if (el.dataset.up && S.up.form) S.up.form[el.dataset.up] = el.value;
  if (el.id === 'gSearch') { S.search = el.value; const pos = el.selectionStart; render(false); const n = $('#gSearch'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.wiz) { S.wiz.info[el.dataset.wiz] = el.value; const sl = $('#w-sl'); if (sl) sl.textContent = signLine(S.wiz.info); }
  if (el.dataset.reason) S.req.reason = el.value;
  if (el.dataset.rp) (S.rp ||= {fmt:'pdf', reason:RP_REASONS[0]})[el.dataset.rp] = el.value;
  if (el.id === 'upFile' && el.files[0]) upFromBlob(el.files[0], null);
  if (el.id === 'vFile' && el.files[0]) compareBlob(el.files[0]);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'login') login(S.loginTab);
  if (f === 'wiz1') { if (!S.wiz.info.contest.trim()) { toast('대회명을 입력해 주세요.'); return; } nav('c/new/2'); }
  if (f === 'up2') upSubmit();
  if (f === 'verify') { const c = $('#vCode').value.trim().toUpperCase(); if (c) { S.v.code = c; openVerify(c, 'code'); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.pop || S.search)) { S.pop = null; S.search = ''; render(false); } });
function bindDrop(){
  const d = $('#drop'); if (!d) return;
  d.addEventListener('dragover', ev => { ev.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', () => d.classList.remove('over'));
  d.addEventListener('drop', ev => { ev.preventDefault(); d.classList.remove('over'); const f = ev.dataTransfer.files[0]; if (!f || !/^image\//.test(f.type)) return; S.path.startsWith('s/upload') ? upFromBlob(f, null) : compareBlob(f, null); });
}

/* actions */
async function openVerify(code, via){
  await nav('v/' + encodeURIComponent(code));
  if (S.mode !== 'loading') { const a = byCode(code); logLookup(code, !a ? 'notfound' : a.status === 'revoked' ? 'revoked' : 'ok', via); }
}
async function doParse(){
  const W = S.wiz, text = W.raw.trim();
  if (!text) { toast('명단 원문을 붙여 넣어 주세요.'); return; }
  nav('c/new/parsing', {instant:true});
  let rows = null, note = ''; const t0 = Date.now();
  if (S.sample) {
    try { const r = await S.sample.json('아래는 대회 수상자 명단 원문입니다(메신저 공지나 공문에서 옮긴 정리되지 않은 텍스트). 수상자 한 사람당 한 항목으로 정리해 JSON 배열 하나로만 답하세요. 형식: [{"award":"우수상","team":"팀 이름(\'팀\' 글자 제외, 없으면 빈 문자열)","name":"홍길동","sid":"학번(없으면 빈 문자열)"}]. 원문에 없는 내용은 만들지 마세요.\n\n원문:\n' + text.slice(0, 6000), {modelTier:'quick'});
      if (Array.isArray(r)) rows = r.filter(x => x && x.name).map(x => ({award:String(x.award||''), team:String(x.team||''), name:String(x.name).replace(/\s/g,''), sid:String(x.sid||'')}));
      note = 'AI가 정리했어요.'; } catch(err) { note = aiErr(err.code) + ' 규칙으로 정리했어요.'; }
  }
  if (!rows || !rows.length) { rows = ruleParse(text); if (!note) note = 'AI 없이 규칙으로 정리했어요.'; }
  const wait = 1100 - (Date.now() - t0); if (wait > 0) await sleep(wait);
  W.roster = rows; W.pv = 0; W.parseNote = rows.length ? `${note} 수상자 ${rows.length}명을 찾았어요.` : '수상자를 찾지 못했어요. 이름과 상 이름이 들어 있는지 확인해 주세요.';
  nav('c/new/3', {replace:true, instant:true});
}
async function doIssue(){
  const W = S.wiz; if (!W.roster.length) return;
  W.progress = 0; W.issued = []; nav('c/new/issuing', {instant:true});
  const base = {contest:W.info.contest.trim(), org:W.info.org.trim(), signer:W.info.signer, date:W.info.date}, now = Date.now();
  try {
    for (let i = 0; i < W.roster.length; i++) {
      const r = W.roster[i];
      const a = {id:newId(), code:genCode(base.date), name:String(r.name).trim(), sid:String(r.sid||'').trim(), team:String(r.team||'').trim(), award:String(r.award).trim(), ...base, status:'issued', source:'issued', createdAt:now + i};
      await save(a); W.issued.push(a); W.progress = i + 1;
      const tx = $('#issueTxt'), br = $('#issueBar'); if (tx) tx.textContent = `${W.progress} / ${W.roster.length}명`; if (br) br.style.width = Math.round(100 * W.progress / W.roster.length) + '%';
      await sleep(220);
    }
    W.roster = []; toast(`${W.issued.length}명에게 상장을 발급했어요.`);
    S.hist = S.hist.filter(p => !p.startsWith('c/new'));
    nav('c/new/done', {replace:true, instant:true});
  } catch(err) { writeErr(err); nav('c/new/3', {replace:true, instant:true}); }
}
async function doDownload(id){
  const a = byId(id); if (!a || !S.downloads) return;
  const tmp = document.createElement('canvas'); tmp.width = WM.W; tmp.height = WM.H; await drawCert(tmp, a);
  const cv = document.createElement('canvas'); cv.width = WM.W * 2; cv.height = WM.H * 2; cv.getContext('2d').drawImage(tmp, 0, 0, cv.width, cv.height);
  try { await S.downloads.save({filename:`${a.name}_${a.award}_${a.code || '상장'}.png`, data:await toBlob(cv)}); toast('저장했어요.'); } catch(err) { if (err.code !== 'declined') toast('이 화면에서는 파일을 저장할 수 없어요.'); }
}
const PAPER = {award:'동상', contest:'숭실대학교 창업경진대회', name:STUDENT.name, team:'', org:'숭실대학교 창업지원단', signer:'창업지원단장', date:'2023-11-16', code:''};
async function upExample(){ const cv = document.createElement('canvas'); cv.width = WM.W; cv.height = WM.H; await drawCert(cv, PAPER); await upFromBlob(await toBlob(cv), PAPER); }
async function upFromBlob(blob, fallback){
  const U = S.up; U.preview = URL.createObjectURL(blob); U.form = null; U.note = '';
  nav('s/upload/reading', {instant:true});
  try { const img = await createImageBitmap(blob); const cv = document.createElement('canvas'); cv.width = 320; cv.height = Math.round(320 * img.height / img.width); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); U.thumb = cv.toDataURL('image/jpeg', .72); } catch(e) { U.thumb = ''; }
  const r = await extract(blob, fallback);
  U.form = r.data ? {...r.data, name:r.data.name || STUDENT.name} : {award:'', contest:'', name:STUDENT.name, team:'', org:'', signer:'', date:''};
  U.note = r.ai ? 'AI가 읽은 내용이에요. 틀린 곳이 있으면 고쳐 주세요.' : r.data ? `${r.note || ''} 틀린 곳이 있으면 고쳐 주세요.` : `${r.note || 'AI가 읽지 못했어요.'} 직접 입력해 주세요.`;
  nav('s/upload/2', {replace:true, instant:true});
}
async function upSubmit(){
  const f = S.up.form; if (!f) return;
  if (!f.award || !f.contest || !f.org) { toast('상, 대회명, 수여 기관은 꼭 채워 주세요.'); return; }
  const a = {id:newId(), code:'', name:f.name || STUDENT.name, sid:STUDENT.sid, team:f.team || '', award:String(f.award).replace(/\s/g,''), contest:f.contest, org:f.org, signer:f.signer || '', date:isoDate(f.date) || f.date, status:'pending', source:'legacy', createdAt:Date.now(), thumb:S.up.thumb || ''};
  try { await save(a); S.up = {preview:null, thumb:'', form:null, note:''}; S.hist = S.hist.filter(p => !p.startsWith('s/upload')); nav('s/upload/3', {replace:true}); } catch(err) { writeErr(err); }
}
async function compareBlob(blob){
  const V = S.v; V.preview = URL.createObjectURL(blob); V.copy = null; V.busy = true;
  if (S.path !== 'v' && S.path !== 'v/copy') nav('v', {instant:true}); else render(false);
  const t0 = Date.now(); let res = {code:null, orig:null, tam:null, view:null};
  try {
    const bmp = await createImageBitmap(blob); const rd = wmRead(bmp), dec = rd.dec;
    const orig = dec.code ? byCode(dec.code) : null, tam = orig ? await wmTamper(rd.L, orig) : {blocks:[], fields:[]};
    res = {code:dec.code, orig, tam, view:wmRevealUrl(rd.cv, dec, tam)};
  } catch(e) {}
  const wait = 1500 - (Date.now() - t0); if (wait > 0) await sleep(wait);
  V.busy = false; V.copy = res;
  if (res.orig) logLookup(res.code, res.orig.status === 'revoked' ? 'revoked' : res.tam.fields.length ? 'forged' : 'ok', 'wm');
  render(false);
}
const exampleOrig = () => byCode('AI-25-7F3A-91C2') || S.awards.find(a => a.status === 'issued' && a.code && a.award !== '대상');
async function genuine(){
  const o = exampleOrig(); if (!o) { toast('예시 원본이 없어요.'); return; }
  const cv = document.createElement('canvas'); cv.width = WM.W; cv.height = WM.H; await drawCert(cv, o);
  const sm = document.createElement('canvas'); sm.width = 636; sm.height = 900; sm.getContext('2d').drawImage(cv, 0, 0, 636, 900);
  await compareBlob(await new Promise(r => sm.toBlob(r, 'image/jpeg', .85)));
}
async function forgery(){
  const o = exampleOrig(); if (!o) { toast('예시 원본이 없어요.'); return; }
  const cv = document.createElement('canvas'); cv.width = WM.W; cv.height = WM.H; await drawCert(cv, o);
  const c = cv.getContext('2d'), bg = await certBg(); if (bg) c.drawImage(bg, 400, 300, 220, 62, 122, 372, 220, 62); c.fillStyle = '#151515'; c.strokeStyle = '#151515'; c.lineWidth = 1.4; c.font = `48px ${CERT_FONT}`; c.textAlign = 'left'; c.strokeText('대 상', 132, 422); c.fillText('대 상', 132, 422);
  await compareBlob(await toBlob(cv));
}

/* boot */
(function boot(){
  const h = (location.hash || '').slice(1);
  if (/^v-AI-\d{2}-[0-9A-F]{4}-[0-9A-F]{4}$/i.test(h)) {
    const code = h.slice(2).toUpperCase(); S.v.code = code; S.path = 'v/' + code;
    render(true);
    const iv = setInterval(() => { if (S.mode !== 'loading') { clearInterval(iv); const a = byCode(code); logLookup(code, !a ? 'notfound' : a.status === 'revoked' ? 'revoked' : 'ok', 'link'); render(false); } }, 200);
  } else {
    S.path = S.role === 'issuer' ? 'c/home' : S.role === 'student' ? 's/home' : 'login';
    render(true);
  }
  initData();
})();
})();
